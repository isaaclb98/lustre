# mypy strict configuration for the kernel package.
#
# `lustre_kernel/` is the foundational shared package used by
# both `search/` and `indexer/`. The plan §4.13 mandates `mypy --strict`
# here: every signature is fully typed, no implicit `Any`, no
# untyped decorators. CI fails on regression.

[mypy]
files = lustre_kernel

# Strict mode.
strict = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True

# We type-check only our own kernel package; downstream (qdrant-client,
# open_clip, torch) are stubs at best.
ignore_missing_imports = True

# `_real_models.py` imports torch / open_clip at module load — those
# are conditional and gated by try/except. The stub types are
# incomplete; we tolerate that here.
[mypy-"lustre_kernel._real_models"]
ignore_errors = True