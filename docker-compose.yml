# Production deployment: one-command setup.
#
# Run:    docker compose up -d
# Open:   http://localhost:8000
#
# This brings up:
#   - Qdrant (vector database) as a sidecar service
#   - Search API + SPA (single container serving both)
#
# Data persistence:
#   - qdrant_data: vector embeddings and metadata (named volume)
#   - thumbnail_data: cached thumbnails (named volume, ~8KB per image)
#   - ${NAS_IMAGES_PATH}: your photo library (read-only bind mount)
#
# To customize, copy to .env and edit:
#   NAS_IMAGES_PATH=/path/to/your/photos
#   QDRANT_API_KEY=your-secret-key  (if you want Qdrant auth)

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: lustre-qdrant
    restart: unless-stopped
    ports:
      # Expose Qdrant for debugging / direct access.
      # In production, you may want to remove this or firewall it.
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource limits (adjust based on your library size)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  search:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    container_name: lustre
    restart: unless-stopped
    # Round 31: GPU passthrough so the in-app indexer can actually
    # use the RTX 3080. NVIDIA Container Runtime must be installed
    # on the host. NVIDIA_VISIBLE_DEVICES=all is required — without
    # it the runtime registers but doesn't inject /dev/nvidia* into
    # the container, and torch.cuda.is_available() returns False
    # even though torch is CUDA-compiled.
    runtime: nvidia
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # Qdrant sidecar — defaults to the compose service name
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: images
      # QDRANT_API_KEY: ${QDRANT_API_KEY:-}  # Uncomment if you enabled Qdrant auth

      # Photo library path — REQUIRED
      # Mount your photo library read-only at /nas. The env var
      # was renamed from NAS_IMAGES_BASE to PHOTOS_DIR in round-35;
      # the old name still works as a deprecated alias so existing
      # .env files don't break on upgrade. New deployments should
      # use PHOTOS_DIR.
      PHOTOS_DIR: /nas

      # In-app indexer (admin Index button). INDEXER_SOURCES is a
      # comma-separated list of paths the spawned indexer should
      # scan. Defaults to PHOTOS_DIR if unset. The default here
      # matches the bind-mounted library at /nas.
      INDEXER_SOURCES: ${INDEXER_SOURCES:-/nas}
      INDEXER_DEVICE: ${INDEXER_DEVICE:-cuda}

      # Frontend URL (for CORS and links)
      WEB_UI_URL: http://localhost:8000

      # Logging
      LOG_LEVEL: INFO

      # Thumbnail storage path (inside container)
      THUMBNAIL_DIR: /app/data/thumbnails
    ports:
      - "8000:8000"
    volumes:
      # Your photo library — READ-ONLY
      # Set NAS_IMAGES_PATH in your .env or shell before running
      - ${NAS_IMAGES_PATH:-./_fixtures}:/nas:ro
      # Persistent data volume — holds SQLite index.db AND HuggingFace model cache.
      # The Dockerfile sets HF_HOME=/app/data/hf-cache so both live under one volume.
      - search_data:/app/data
      # Thumbnail cache — generated at index time (~8KB per image, 16GB for 2M photos)
      # Separate volume for isolation (can be cleared/regenerated without affecting index)
      - ${THUMBNAIL_DIR:-./_thumbnails}:/app/data/thumbnails
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust based on your library size)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

volumes:
  qdrant_data:
    driver: local
  search_data:
    driver: local
