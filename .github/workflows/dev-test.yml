# .github/workflows/dev-test.yml
#
# On-demand Playwright e2e run against an isolated dev_server
# (in-memory Qdrant + 20 synth JPEGs). Replaces the old
# nightly-e2e workflow — same infra, but parameterised for
# dev-time iteration:
#
#   gh workflow run dev-test.yml                          # all 177 tests, against main
#   gh workflow run dev-test.yml -f test_files=smoke      # one file
#   gh workflow run dev-test.yml -f ref=isaaclb98:foo     # test a branch
#   gh workflow run dev-test.yml -f test_files=photo-page,smoke -f ref=...
#
# Why on-demand only (no schedule, no PR trigger):
#   - Dev iteration: you run when you need results, not on every push.
#   - Free-tier minutes: 2,000 min/mo for public repos. A full run
#     is ~8-12 min, so 150-200 runs/mo fits comfortably; auto-running
#     on every PR push would burn that budget fast.
#   - Tests are async-by-nature here: the workflow takes minutes to
#     boot (uv sync, npm ci, npm build, Playwright install). Better
#     to commit to that explicitly than to have it fire on every push.
#
# What gets exercised:
#   - search.dev_server --no-model --demo-data → in-memory Qdrant +
#     20 synth JPEGs + SPA mounted on port 8000 (no SigLIP2 model
#     download — uses the registry mock).
#   - npx playwright test <test_files> → focused subset or full suite.
#   - Uploads frontend/playwright-report/ as artifact on every run,
#     dev-server log on failure. 14-day retention.
#
# Cost: free for public repos up to 2,000 CI-min/month. Storage
# capped at 2 GB per workflow artifact (report + screenshots is
# well under that).

name: dev-test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag, or SHA to test (defaults to main). Use
          `owner:branch` for cross-fork refs.
        required: false
        type: string
        default: main
      test_files:
        description: >-
          Comma-separated test file names from frontend/e2e/
          (without the .test.ts suffix). Empty = run the full
          suite. Example: smoke,photo-page,user-journeys.
        required: false
        type: string
        default: ""

# Per-ref concurrency: re-running the same branch cancels the
# previous in-flight run instead of stacking minutes.
concurrency:
  group: dev-test-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (dev_server --no-model --demo-data)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          # shallow clone is fine for CI; avoids pulling the full
          # history on every run. 1 commit is enough.
          fetch-depth: 1

      - name: Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-local-prefix: .venv
          python-version: "3.12"

      - name: Sync Python deps
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        # @playwright/test doesn't ship browser binaries — they're
        # downloaded on first use into ~/.cache/ms-playwright/.
        # CI runners don't cache them by default, so install
        # chromium explicitly. --with-deps pulls the apt deps
        # too (libnss3, libatk, etc.) on debian-based images.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build SPA
        # adapter-static output lands in frontend/build. The
        # backend's create_app() mounts this via FRONTEND_DIR
        # when present, falls back to /app/static in production.
        working-directory: frontend
        run: npm run build

      # Start dev server, wait for /healthz, then run Playwright
      # against it — all in ONE step. Backgrounding the dev server
      # across separate GHA steps didn't work: the runner kills
      # child processes when each step's shell exits, so by the
      # time the "Run Playwright" step started, the server was
      # already gone (Playwright timed out waiting for the URL).
      # Co-locating keeps the dev server alive for the entire
      # playwright run; it dies naturally when the step ends.
      - name: Run dev server + Playwright e2e
        env:
          # SEARCH_NO_MODEL skips the SigLIP2 model load; the
          # registry's mock-1536 embedder is used instead
          # (deterministic vectors so screenshot diffs stay stable).
          # SEARCH_TEST_MODE flips the same env the test backend uses.
          SEARCH_TEST_MODE: "1"
          SEARCH_NO_MODEL: "1"
          LOG_LEVEL: "WARNING"
          # CI=true flips playwright to single-worker + 2 retries
          # (see frontend/playwright.config.ts).
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          # FRONTEND_DIR tells create_app() where to find the SPA
          # build (default is /app/static, the production path).
          # Without this, the dev_server only exposes the API —
          # playwright tests would 404 on every page load.
          FRONTEND_DIR: ${{ github.workspace }}/frontend/build
        run: |
          set -euo pipefail
          mkdir -p .dev-test-logs

          # --demo-data synthesises 20 JPEGs into
          # $TMPDIR/lustre-demo/ and indexes them into an
          # in-memory Qdrant. The server listens on :8000.
          uv run python -m search.dev_server \
            --no-model --demo-data \
            --host 127.0.0.1 --port 8000 \
            > .dev-test-logs/dev-server.log 2>&1 &
          DEV_PID=$!
          echo "dev-server pid: $DEV_PID"

          # Poll /healthz — usually up in ~5s but Qdrant boot +
          # index init can take 30s+. If it doesn't come up in 60s,
          # surface the failure and exit non-zero so the run fails
          # cleanly with the dev-server log as context.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "dev-server up after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = 60 ]; then
              echo "dev-server failed to start; tail of log:"
              tail -40 .dev-test-logs/dev-server.log
              kill $DEV_PID 2>/dev/null || true
              exit 1
            fi
          done

          # Build the playwright file list. Empty input → run all.
          # Otherwise, comma-separated stems get the .test.ts suffix
          # and become a space-separated list of file paths.
          cd frontend
          TEST_FILES='${{ inputs.test_files }}'
          if [ -z "$TEST_FILES" ]; then
            PLAYWRIGHT_ARGS=""
          else
            # Convert comma-separated stems → space-separated file paths.
            # e.g. "smoke,photo-page" → "e2e/smoke.test.ts e2e/photo-page.test.ts"
            FILES=$(echo "$TEST_FILES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sed 's/$/.test.ts/' | sed 's|^|e2e/|' | tr '\n' ' ')
            PLAYWRIGHT_ARGS="$FILES"
          fi
          echo "playwright args: $PLAYWRIGHT_ARGS"

          # Cleanup on exit so the next step (uploads) doesn't race
          # the dying server for the log file.
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          # `eval` would be cleaner but quoting gets ugly; an array
          # via shell is the conventional safe approach. Bash here.
          npx playwright test $PLAYWRIGHT_ARGS --reporter=github

      - name: Upload Playwright report
        # Both on success and failure — the report has the trace +
        # screenshots that make failures debuggable. 14 days is
        # enough to spot a regression over the last 1-2 weeks.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload dev-server log on failure
        # The Playwright report tells you what the UI did; the
        # dev-server log tells you what the backend did. Both are
        # needed to debug a flaky e2e.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: .dev-test-logs/
          retention-days: 14
