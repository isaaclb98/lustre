# .github/workflows/ci.yml
#
# Single CI workflow for lustre. Replaces the older
# dev-build.yml (4 jobs, parallel backend/frontend, path filters)
# with one job that runs the full test + lint suite.
#
# Why one job, not parallel:
#   Backend is ~30s, frontend is ~30s. Parallel saves ~30s of wall
#   time but doubles workflow complexity. For a personal repo the
#   simpler shape wins.
#
# Why full lint, not --changed:
#   `--changed` is git-aware and skips the 58 baseline errors that
#   pre-date the per-file-ignore era. `ruff check .` runs in <1s
#   on a clean tree and guarantees new debt can't land via a fast
#   follow-up commit.
#
# Why this trigger set:
#   - push:dev catches every commit on the default branch — your
#     actual workflow per memory ("commit freely on dev").
#   - push:main validates post-merge state (no test rot can sneak
#     in via a fast follow-up merge to main).
#   - pull_request:main covers the PR workflow when you open one.
#   - workflow_dispatch for manual re-runs.
#
# Image builds go in image-build.yml. E2E (dispatch-only) in
# nightly-e2e.yml. This file is just the fast inner loop.

name: ci

# Triggers (revised Oct 2026 per Isaac's request):
#   - push:main: post-merge validation. Catches test rot that
#     could sneak in via a fast follow-up merge.
#   - push:dev: pre-merge validation. Catches lint/test failures
#     before they reach main, so dev stays green-as-it-shelves.
#   - pull_request:main: the PR workflow when one is opened.
#   - workflow_dispatch: manual re-runs as an escape hatch.
#
# Note: this doubles the runner-minutes on dev pushes. Previous
# Aug 2026 rationale ("redundant work, code is about to go to
# main anyway") is reversed — Isaac wants the dev signal.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves runner-minutes
# when you push several commits in quick succession. Standard GHA
# pattern; safe because each run sees the latest commit anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend + frontend tests + full lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
          # cache-local-path: removed. The previous setting pointed
          # the action at .venv/ as both the venv AND the cache dir,
          # which broke on a fresh checkout: the action would create
          # .venv/ as an empty cache dir, then `uv sync` would find
          # the empty .venv/ and refuse to use it ("no Python
          # executable was found"). The action's default wheel cache
          # (auto-keyed on pyproject.toml + uv.lock) is what we
          # actually need for fast syncs; we don't need the venv
          # itself cached.

      - name: Install system deps (libvips)
        # pyvips is a Python binding to the C libvips library; the
        # library itself has to be installed at the OS level. The
        # GHA ubuntu-latest image *used to* ship libvips, but the
        # Oct 19, 2026 runner-image refresh (note the deprecation
        # warnings) removed it. Without this, tests/test_thumbnails*
        # crash with "cannot load library 'libvips.so.42'".
        #
        # Same apt line as docker/Dockerfile.search so what passes
        # CI matches what ships in the production image.
        run: sudo apt-get update && sudo apt-get install -y libvips42 libvips-tools

      - name: Sync Python deps
        # uv sync --extra dev creates .venv and installs the [dev]
        # extra (pytest, ruff, mypy, pytest-xdist, pytest-cov) in
        # one resolver pass. Cached on pyproject.toml + uv.lock.
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Round-50: install libvips system package so the new
      # pyvips-based thumbnail tests can load libvips.so.42. The
      # indexer's primary encoder is now libvips (via pyvips); the
      # PIL fallback path is still covered by tests but pyvips is
      # importable at module load time, so libvips MUST be present
      # for the test process to even start.
      - name: Install libvips (test host)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips42 \
            libvips-tools
          # Verify pyvips can locate the shared library; the test
          # collection errors at import time with "cannot load
          # library 'libvips.so.42'" if the apt install failed.
          uv run python -c "import pyvips; print('pyvips', pyvips.__version__)"

      # ---------------- Backend ----------------
      - name: Lint (ruff, full tree)
        # Full tree — not --changed. Catches new debt immediately;
        # baseline is 0 (post-ruff-amnesty) so this is just
        # insurance against future regressions. ~1s on a clean tree.
        run: uv run ruff check .

      - name: Type check (mypy, kernel package only)
        # lustre_kernel is the shared package imported by
        # both search/ and indexer/. Strict-mode mypy there catches
        # API contract drift before the runtime does.
        run: uv run mypy lustre_kernel/

      - name: Run pytest
        # In-memory Qdrant fixture handles the side store so we
        # don't need a service container. -n auto detects worker
        # count on the runner (typically 2-4 on GitHub-hosted
        # ubuntu-latest).
        #
        # --cov-fail-under=70 gates CI on coverage drift.
        # --cov-report=xml produces coverage.xml for the artifact
        # upload below; --cov-report=term-missing keeps the live
        # log readable.
        # --junitxml feeds the GHA Tests tab.
        #
        # QDRANT_URL must point at a port nothing listens on, NOT
        # the production Qdrant port. The env var here OVERRIDES
        # the default in tests/conftest.py, so setting it to 6333
        # would re-arm the exact failure that deleted the
        # production collection twice: a test that reaches the
        # reconciler with a variant mismatch would drop the live
        # collection. The reconciler now refuses to start on a
        # mismatch, but the dead port is the second line of
        # defence — a connection error instead of a deletion.
        env:
          QDRANT_URL: "http://localhost:16333"
          SEARCH_TEST_MODE: "1"
          LOG_LEVEL: "WARNING"
        run: |
          uv run pytest tests/ -q -n auto --tb=short \
            --cov --cov-fail-under=70 \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=pytest-junit.xml

      # ---------------- Frontend ----------------
      - name: svelte-check (type + a11y)
        working-directory: frontend
        run: npm run check

      - name: Vitest (unit + contract)
        working-directory: frontend
        run: npm run test:unit

      # ---------------- Artifacts ----------------
      - name: Upload coverage report
        # coverage.xml is browseable on raw GitHub and importable
        # into Codecov/Coveralls if you ever want a coverage
        # badge. 30-day retention.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30