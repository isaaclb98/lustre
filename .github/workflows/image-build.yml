# .github/workflows/image-build.yml
#
# Build the search-side container for both linux/amd64 and linux/arm64
# and push to GitHub Container Registry as a multi-arch OCI image
# index. Deployments pin to `:latest` and `docker pull` resolves to
# the native manifest for the host arch.
#
# Three jobs:
#   1. `build-and-push` (matrix of amd64 + arm64): each leg runs on
#      a GHA-hosted runner native to its target arch — no QEMU.
#      Each leg pushes its image under `:latest-<arch>` (NOT `:latest`).
#      If both legs pushed `:latest`, the second would silently
#      overwrite the first because the registry treats `:latest` as
#      a single pointer, not as an OCI image index.
#   2. `create-index`: depends on both build legs, runs on amd64
#      (imagetools is arch-agnostic). Combines `:latest-amd64` and
#      `:latest-arm64` into an OCI image index tagged `:latest` and
#      `:sha-<7-char>` via `docker buildx imagetools create`.
#   3. Prune old `:sha-*` tags (always present, always runs once
#      after the index is created).
#
# After create-index completes, `docker pull :latest` on either arch
# resolves to the matching per-arch manifest digest.
#
# Tags produced:
#   - `:latest`         — OCI image index; what deployments pin to.
#   - `:latest-amd64`   — single-arch amd64 image (push target for
#                         the amd64 build leg).
#   - `:latest-arm64`   — single-arch arm64 image (push target for
#                         the arm64 build leg).
#   - `:sha-<7-char>`   — per-commit OCI image index (same content
#                         as `:latest` at that commit); useful for
#                         rollback.
#
# Trigger filter: `on.push.paths` is an allowlist of paths whose
# presence in the diff is necessary to trigger a build. The Dockerfile
# only depends on `docker/Dockerfile.search`, `pyproject.toml`,
# `README.md`, `search/`, and `indexer/`; the workflow file itself
# is in the allowlist so editing CI still rebuilds. Touching tests/,
# LICENSE, plain markdown, or other non-build artifacts skips the
# build entirely — which is what we want, since the `dev-build.yml`
# workflow already covers tests/lint for feature branches.
#
# Layer cache: GHA backend (type=gha, mode=max) — keyed off the
# final layer hash so unchanged Dockerfile steps reuse the previous
# build's cache. Scoped per-arch (`...-amd64`, `...-arm64`) so the
# two matrix legs don't trample each other's cache entries. The
# SigLIP2 model download layer in particular saves ~1.5 GB of
# network + disk per rebuild when only source changed.
#
# Required permission: `packages: write` (scoped to each job) so
# GITHUB_TOKEN can push to ghcr.io/<owner>/<repo> without storing
# a PAT as a secret. Deployments pull the same image anonymously
# because ghcr.io packages default to public for GH Actions pushes
# from public repos.

name: image-build

on:
  # Manual trigger — useful for verifying a Dockerfile / workflow change
  # on a feature branch without merging to main first. ArgoCD only
  # watches the :latest tag on main, so a dispatch build on any other
  # branch produces a :sha-* image that nothing rolls to automatically.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.search
      - pyproject.toml
      - README.md
      - search/**
      - indexer/**
      - scripts/**
      - frontend/**
      - lustre_kernel/**
      - .dockerignore
      - .github/workflows/image-build.yml

# Cancel any in-flight run on main so a fast follow-up push doesn't
# race the previous build's3-5 min of layer pulls + SigLIP2 download.
# Mirrors dev-build.yml's concurrency block.
concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # Round-35: build both linux/amd64 (existing prod arch) and
        # linux/arm64 (the Tailscale-reachable Oracle VM is aarch64)
        # in parallel. Each leg runs on a GHA-hosted runner native
        # to its arch — no QEMU emulation. ubuntu-24.04-arm has been
        # free-tier eligible in public repos since 2025-01-16.
        #
        # Each leg pushes to a per-arch tag (`:latest-<arch>`) instead
        # of `:latest`. The two `build-and-push` legs would otherwise
        # both push `:latest` and the second would overwrite the
        # first (the registry treats `:latest` as a single pointer,
        # not an OCI image index — only explicit `manifest create`
        # or `imagetools create` produces a multi-arch index).
        #
        # The `create-index` job below depends on both legs and uses
        # `docker buildx imagetools create` to combine the two
        # per-arch tags into an OCI image index tagged `:latest` and
        # `:sha-<short>`. After that, `docker pull :latest` on either
        # arch resolves to the matching per-arch manifest.
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per-arch tag)
        # Round-17: single-step push streams layers to ghcr.io
        # without ever materializing the image on the runner. We
        # override the default tag (`:latest`) with the per-arch
        # tag (`:latest-<arch>`) so the two matrix legs don't
        # overwrite each other. The `create-index` job below
        # combines the two per-arch images into a multi-arch
        # `:latest` index.
        #
        # Why provenance=false and sbom=false: build-push-action
        # v5+ defaults to producing SLSA provenance + SBOM
        # attestations wrapped in an OCI image index. That
        # adds a separate attestation manifest + config blob
        # per image, and `imagetools create` propagates the
        # attestation references into the multi-arch index.
        # When the prune-untagged-versions step deletes the
        # attestation manifests (they go untagged after the
        # next build), the per-arch image indexes' references
        # to them dangle and `docker pull :latest` returns
        # 404. Disabling both keeps the build output a single
        # image manifest per arch — no OCI index wrapper, no
        # attestation blobs to get orphaned.
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.search
          push: true
          load: false
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.title=lustre
            org.opencontainers.image.description=Lustre — self-hosted semantic image search powered by SigLIP2 and Qdrant
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,mode=max,scope=lustre-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lustre-build-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # Combine the two per-arch images into a multi-arch :latest index
  # ---------------------------------------------------------------------
  # Each build-and-push leg above pushes to `:latest-<arch>`. This job
  # depends on both legs finishing successfully and uses `docker buildx
  # imagetools create` to combine them into an OCI image index tagged
  # `:latest` and `:sha-<short>`. After this completes, `docker pull
  # :latest` on either arch resolves to the matching per-arch manifest.
  create-index:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io (needed to pull per-arch images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch index for :latest and :sha-<short>
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          echo "Multi-arch index created at ${IMAGE}:latest (refs amd64 + arm64)"
          echo "Multi-arch index also tagged ${IMAGE}:sha-${SHORT_SHA}"

      # ---------------------------------------------------------------------
      # Prune old :sha-* tags after a successful push
      # ---------------------------------------------------------------------
      # The GHCR free tier gives 0.5 GB of container storage. Without
      # pruning, every successful push accumulates a new :sha-<7>
      # tag and the package runs out of space in a few weeks of
      # active development. This step keeps the 5 most recent
      # :sha-* tags and the :latest tag (which ArgoCD watches),
      # deleting anything older.
      #
      # Why 5: enough to roll back a few releases without rebuilding,
      # small enough that a 100 MB-per-tag image stays under ~500 MB
      # total storage. Tune by setting KEEP_TAGS.
      #
      # Tags are listed via the packages API (works inside an
      # image-build run because GITHUB_TOKEN gets packages:read +
      # packages:write by default for repo-scoped tokens — verify
      # under Settings → Actions → General → Workflow permissions
      # if this step starts 403'ing).
      - name: Prune old :sha-* tags
        if: success()
        env:
          # `gh` doesn't auto-discover GITHUB_TOKEN in GH Actions on
          # every runner image — it wants GH_TOKEN explicitly. Without
          # this, `gh api` exits non-zero with "set the GH_TOKEN
          # environment variable", `mapfile` ends up with an empty
          # array, and the step silently "finds" 0 sha-* tags — which
          # is exactly the silent regression that left 18 old tags
          # piled up before this was fixed. Setting both names covers
          # newer `gh` versions that DO honour GITHUB_TOKEN as a
          # fallback, so future runner image changes don't re-break.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          KEEP_TAGS: "5"
        run: |
          set -euo pipefail

          # Sanity: confirm gh can auth BEFORE we lose the exit
          # code inside the mapfile. `gh auth status` writes to
          # stderr on failure, which `set -e` would otherwise
          # mask. Bail loudly so a future token-permission
          # regression can't silently no-op the prune again.
          gh auth status >/dev/null

          # List all versions for this container package. The
          # endpoint returns the most recent first; we walk it in
          # reverse because deleting the N oldest is idempotent if
          # the run is re-triggered.
          echo "Listing versions for ${PACKAGE_OWNER}/${PACKAGE_NAME}..."
          # `gh api ... --jq` returns the raw API payload where
          # the tag list lives at `.metadata.container.tags`, NOT
          # at top-level `.tags` (which is always null on this
          # endpoint). The `select(... | length > 0)` skips the
          # untagged buildx cache layers — `length` on a null
          # path returns 0, so this naturally excludes them
          # without needing `// []` (which we keep anyway as a
          # belt-and-braces default). Buildx cache layers are
          # kept by design (for cache-hit speedups); we only want
          # tagged, named versions here.
          #
          # NB: the comment MUST live above the `gh api` block,
          # not between its continuation lines — `# comment`
          # after `\` terminates the continuation and `bash` parses
          # the next non-comment line as a fresh command.
          mapfile -t VERSIONS < <(
            gh api \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | length > 0) | "\(.id)\t\(.name)\t\(.metadata.container.tags | join(","))"'
          )

          # Fail loudly if the API returned zero versions. The
          # only sane way this happens is auth failure (which
          # `gh auth status` above would already have caught) or
          # a 404 / 403 we somehow ate — both are "stop the
          # pipeline" conditions, not "keep accumulating tags".
          if [[ ${#VERSIONS[@]} -eq 0 ]]; then
            echo "::error::gh api returned 0 versions for ${PACKAGE_OWNER}/${PACKAGE_NAME}." >&2
            echo "::error::Refusing to silently skip the prune — check GH_TOKEN scopes and package visibility." >&2
            exit 1
          fi

          # Filter to sha-* tags only; keep :latest unconditionally.
          SHA_TAGS=()
          for v in "${VERSIONS[@]}"; do
            tags="${v##*$'\t'}"  # last field = tags
            tags="${tags##*$'\t'}"  # safety: re-strip if multi-tab
            if [[ "$tags" == *"sha-"* ]]; then
              id="${v%%	*}"  # first field = id
              SHA_TAGS+=("$id")
            fi
          done

          echo "Found ${#SHA_TAGS[@]} sha-* tags (newest first)."

          # Delete everything beyond the keep-window. Reverse so we
          # delete oldest first (more predictable; if any delete
          # fails we still keep the newest N).
          TO_DELETE=$(printf '%s\n' "${SHA_TAGS[@]}" | tail -n +$((KEEP_TAGS + 1)))
          if [[ -z "$TO_DELETE" ]]; then
            echo "Nothing to delete (${#SHA_TAGS[@]} <= ${KEEP_TAGS})."
            exit 0
          fi

          count=0
          for id in $TO_DELETE; do
            if gh api -X DELETE \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions/${id}"; then
              count=$((count + 1))
            fi
          done
          echo "Pruned $count old sha-* tags (kept $KEEP_TAGS newest + :latest)."

      # -----------------------------------------------------------------------
      # Prune untagged (zombie) versions
      # -----------------------------------------------------------------------
      # When a per-arch build pushes :latest-amd64 (or :latest-arm64),
      # the previous manifest for that tag becomes untagged but is NOT
      # garbage-collected by the registry. Without this step every
      # GHA run leaves an orphaned manifest behind; over a few weeks
      # that piles up to ~90 versions and consumes the GHCR free-tier
      # 0.5 GB quota.
      #
      # Strategy: keep the N most recent untagged versions (defensive
      # buffer in case a rollback path needs an in-flight per-arch
      # image). N defaults to 2 (one per arch) — see KEEP_UNTAGGED.
      #
      # Reuses the same /versions endpoint, filtered to entries with
      # empty tags, then deletes everything older than the Nth newest.
      - name: Prune untagged (zombie) versions
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          KEEP_UNTAGGED: "2"
        run: |
          set -euo pipefail
          gh auth status >/dev/null

          echo "Listing untagged versions for ${PACKAGE_OWNER}/${PACKAGE_NAME}..."
          # Same endpoint, but select entries where tags is empty.
          mapfile -t UNTAGGED < <(gh api \
            --paginate \
            -q '.[] | select((.metadata.container.tags // []) | length == 0) | "\(.id)\t\(.created_at)"' \
            "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions")
          echo "Found ${#UNTAGGED[@]} untagged versions (newest first)."

          # Delete everything beyond the keep-window. Same tail-from-N+1
          # pattern as the sha-* prune so the behaviour is predictable.
          TO_DELETE=$(printf '%s\n' "${UNTAGGED[@]}" | tail -n +$((KEEP_UNTAGGED + 1)))
          if [[ -z "$TO_DELETE" ]]; then
            echo "Nothing to delete (${#UNTAGGED[@]} <= ${KEEP_UNTAGGED})."
            exit 0
          fi

          count=0
          for id in $TO_DELETE; do
            if gh api -X DELETE \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions/${id}"; then
              count=$((count + 1))
            fi
          done
          echo "Pruned $count untagged versions (kept newest ${KEEP_UNTAGGED})."
