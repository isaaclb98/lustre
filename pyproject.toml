[project]
name = "lustre"
version = "0.1.0"
description = "Self-hosted semantic image search. SigLIP2 embeddings → Qdrant → text/image queries."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]

dependencies = [
    # Search side (FastAPI app)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # gunicorn is the process manager for the single-container image
    # (docker/Dockerfile.search runs `gunicorn -k uvicorn.workers.UvicornWorker`).
    # Without it the container fails with `exec: gunicorn: not found`.
    "gunicorn>=21.2",
    "qdrant-client>=1.10",
    # .env file loading (used by both indexer + search)
    "python-dotenv>=1.0",
    # SigLIP2 model loading — open_clip (matches isaac-image-scoring)
    "open_clip_torch>=2.31.0",
    # open_clip's tokenizer path lazy-imports `transformers.AutoTokenizer`
    # at runtime (see vendor/open_clip/tokenizer.py:451). Without this,
    # the Dockerfile pre-warm step (Dockerfile.search:37) fails with
    # `ModuleNotFoundError: No module named 'transformers'`.
    "transformers>=4.40",
    "timm>=1.0.15",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10",
    "pillow-heif>=0.16",
    "blurhash>=1.0",  # LQIP placeholders — computed at index time, decoded client-side
    # libvips (via pyvips) — primary thumbnail encoder. libvips
    # is the C library that does 4:4:4 chroma + linear-light
    # resize + ICC profile embed + WebP encode as a single fast
    # pipeline. pyvips is the thin Python binding. The system
    # needs libvips installed (apt: libvips-tools); see
    # docker/Dockerfile.search for the install line. If libvips
    # is missing at runtime the indexer falls back to a slower
    # PIL+numpy path that does the same four behaviors — see
    # indexer/thumbnails.py:_use_pyvips().
    "pyvips>=2.2",
    "tqdm>=4.66",
    # Streaming ZIP archive for /favorites/download.zip — doesn't
    # buffer the whole archive in memory.
    "zipstream-ng>=1.1",
    # (bcrypt + itsdangerous removed with auth — use a reverse-proxy
    # auth layer if you need access control.)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23,<0.24",  # T1.1: tight pin before strict-mode migration
    "anyio>=4",
    "ruff>=0.6",
    # Coverage reporting. T1.3: fail CI under threshold so untested
    # modules can't grow unnoticed.
    "pytest-cov>=5",
    # Parallel test execution. The backend CI job runs
    # `pytest -n auto` so the runner's CPU count drives worker
    # fan-out. Pinned >=3.6 for the modern `-n auto` semantics;
    # see .github/workflows/dev-build.yml.
    "pytest-xdist>=3.6",
    # Strict static type-check on lustre_kernel/. CI runs
    # `mypy lustre_kernel/` against mypy.ini; installed here
    # so `uv sync --extra dev` is the only install command needed.
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["search", "indexer", "lustre_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"  # T1.1: explicit @pytest.mark.asyncio on each async test
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# T1.3: coverage reporting + threshold gate. The threshold is
# intentionally low to start; the goal is to make coverage drift
# visible, not to force a refactor to hit 90% in one PR.
[tool.coverage.run]
source = ["search", "indexer", "lustre_kernel"]
omit = [
    # Test fixtures and dev-only scripts
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
# Skip the `pragma: no cover` comments + non-trivial defensive lines.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Per-file threshold (no per-file minimum yet — single global).
skip_covered = false
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Defaults are F (pyflakes) + E/W (pycodestyle). Add I (isort) so
# imports stay sorted as the codebase grows. Security (S) + comprehensions
# (C4) + simplification (SIM) catch the cheap categories without
# triggering on legacy templates; bump selectively later.
extend-select = ["I", "S", "C4", "SIM", "B", "UP"]
# Per-file opt-outs for paths that legitimately don't need linting.
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # `assert` is the whole point of tests
    # Tests legitimately catch broad exceptions (PIL feature probes,
    # mock fall-throughs, etc.) and use fixture passwords.
    "BLE001",
    "S105",
    # Cheap-to-fix style nits we don't want blocking CI for tests.
    "C408",
    "RUF059",
    # Inline imports inside test fixtures (semicolon-separated
    # multi-statements, conditional imports, fixture-local helpers)
    # are inherently hard to order in a way ruff's isort agrees with.
    # Suppress I001 for tests/ rather than restructuring dozens of
    # working fixture bodies. See lint step 13 in the commit log.
    "I001",
]
"bin/*" = ["T201", "S"]  # CLI helpers may print freely
# scripts/ and benchmarks/ are dev tools invoked manually from the
# repo root, not part of the package or its tests. They're allowed
# the same leeway as bin/: print freely, use simple random
# (image-synth), open user-supplied URLs, write to /tmp, use asserts
# in micro-benchmarks. None of this code ships in the package or runs
# under CI's test path.
"scripts/*" = [
    "T201",   # print()
    "S",      # security audits (URL schemes, /tmp, etc.) — dev tool
    "EXE001", # shebangs without +x — invoked via `python scripts/foo.py`
    "B007",   # unused loop vars
    "PERF102",# use .values() — micro-perf, not relevant for one-shot scripts
]
"benchmarks/*" = [
    "S101",   # asserts are the point of micro-benchmarks
    "S311",   # deterministic-but-not-cryptographic random is fine for synth
    "S",      # dev tool, same leeway as scripts/
    "B007",
]
# Don't touch vendored / generated artifacts.
"**/__pycache__" = ["F401", "F403"]
".venv/**" = ["F401", "F403", "E402"]
# Round-78 cache bust - touch 2026-10-07 to force rebuild after GHCR corruption
